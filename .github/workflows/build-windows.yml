name: Build Windows
# Modified 2026-10-16: verify the frozen EXE after building, including Qt DLL load.

on:
  push:
    branches:
      - main
      - stage-2-portfolio
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Qt resources
        run: pyside6-rcc resources/resources.qrc -o resources/resources_rc.py

      - name: Run portfolio and related baseline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.core.test_portfolio tests.core.test_multi_portfolio tests.core.test_risk tests.ui.test_portfolio tests.ui.test_risk tests.core.test_watchlist tests.core.test_config tests.core.test_window_rules tests.data.test_quotes tests.data.test_bars tests.core.test_quote_presentation -v

      - name: Offscreen application startup (not a physical desktop test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_portfolio.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm StockWidget.spec

      - name: Start the actual frozen EXE with isolated PATH and temporary data
        run: python scripts/verify_windows_package.py --exe dist/StockWidget/StockWidget.exe --report frozen-startup.json

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "from stockwidget.constants import APP_VERSION; print(APP_VERSION)").Trim()
          if (-not $version) {
            throw "APP_VERSION is empty"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Create release zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python scripts/package_windows.py --output "StockWidget-Windows-$env:RELEASE_VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: StockWidget-Windows-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          archive: false
